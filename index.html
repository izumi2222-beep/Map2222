
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKKO NAVI｜日光観光マップ</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 16px;
        }

        h1 {
            margin-bottom: 8px;
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
        }

        button:hover {
            background: #eeeeee;
        }

        #map {
            height: 500px;
            width: 100%;
        }

        @media (max-width: 600px) {
            #map {
                height: 70vh;
            }
        }
    </style>
</head>

<body>

    <h1>NIKKO NAVI</h1>

    <div id="controls">
        <button id="trackingButton" onclick="toggleTracking()">
            現在地を共有
        </button>

        <button onclick="changeLanguage('ja')">日本語</button>
        <button onclick="changeLanguage('en')">English</button>
        <button onclick="changeLanguage('ko')">한국어</button>
        <button onclick="changeLanguage('zh-cn')">中文（简体）</button>
        <button onclick="changeLanguage('zh-tw')">中文（繁體）</button>
        <button onclick="changeLanguage('vi')">Tiếng Việt</button>
    </div>

    <p id="intro">日光の観光スポットを巡ろう！</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 地図を作成
        const map = L.map('map').setView([36.758, 139.598], 14);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            referrerPolicy: 'strict-origin-when-cross-origin'
        }).addTo(map);

        // 観光スポットのマーカー
        const toshogu = L.marker([36.7586, 139.5980]).addTo(map);
        const futarasan = L.marker([36.7570, 139.5985]).addTo(map);
        const rinnoji = L.marker([36.7560, 139.5960]).addTo(map);
        const shinkyo = L.marker([36.7486, 139.6120]).addTo(map);

        // 6言語の翻訳辞書
        const translations = {
            ja: {
                pageTitle: 'NIKKO NAVI｜日光観光マップ',
                intro: '日光の観光スポットを巡ろう！',
                trackingStart: '現在地を共有',
                trackingStop: '現在地の共有を停止',
                trackingPending: '位置情報を取得中...',
                locationPopup: 'あなたの現在地',
                locationUnavailable: 'このブラウザでは位置情報を使えません。',
                locationError: '現在地を取得できませんでした。位置情報の許可や設定を確認してください。',
                toshogu: {
                    name: '日光東照宮',
                    text: '徳川家康を祀る神社です。',
                    detail: '世界遺産「日光の社寺」の一つです。'
                },
                futarasan: {
                    name: '二荒山神社',
                    text: '男体山をご神体とする神社で、日光の山岳信仰の中心の一つです。',
                    detail: '世界遺産「日光の社寺」の一つです。'
                },
                rinnoji: {
                    name: '輪王寺',
                    text: '奈良時代に創建された、日光を代表する寺院です。',
                    detail: '三仏堂などの歴史的な建造物があります。'
                },
                shinkyo: {
                    name: '神橋',
                    text: '日光を代表する美しい朱塗りの橋です。'
                }
            },

            en: {
                pageTitle: 'NIKKO NAVI | Nikko Tourist Map',
                intro: 'Explore the sights of Nikko!',
                trackingStart: 'Share My Location',
                trackingStop: 'Stop Sharing Location',
                trackingPending: 'Getting location...',
                locationPopup: 'Your current location',
                locationUnavailable: 'Geolocation is not supported by this browser.',
                locationError: 'Could not get your location. Check your location permissions and settings.',
                toshogu: {
                    name: 'Nikko Toshogu Shrine',
                    text: 'A shrine dedicated to Tokugawa Ieyasu.',
                    detail: 'Part of the UNESCO World Heritage Site, Shrines and Temples of Nikko.'
                },
                futarasan: {
                    name: 'Nikko Futarasan Shrine',
                    text: 'A shrine associated with Mount Nantai and Nikko’s mountain worship.',
                    detail: 'Part of the UNESCO World Heritage Site, Shrines and Temples of Nikko.'
                },
                rinnoji: {
                    name: 'Rinnoji Temple',
                    text: 'A historic Buddhist temple founded during the Nara period.',
                    detail: 'Its historic buildings include Sanbutsudo Hall.'
                },
                shinkyo: {
                    name: 'Shinkyo Bridge',
                    text: 'A beautiful vermilion bridge and one of Nikko’s famous landmarks.'
                }
            },

            ko: {
                pageTitle: 'NIKKO NAVI | 닛코 관광 지도',
                intro: '닛코의 관광 명소를 둘러보세요!',
                trackingStart: '현재 위치 공유',
                trackingStop: '위치 공유 중지',
                trackingPending: '위치 확인 중...',
                locationPopup: '현재 위치',
                locationUnavailable: '이 브라우저에서는 위치 정보를 사용할 수 없습니다.',
                locationError: '현재 위치를 가져올 수 없습니다. 위치 권한과 설정을 확인해 주세요.',
                toshogu: {
                    name: '닛코 도쇼구 신사',
                    text: '도쿠가와 이에야스를 모신 신사입니다.',
                    detail: '세계유산인 닛코의 신사와 사찰을 구성하는 유적 중 하나입니다.'
                },
                futarasan: {
                    name: '닛코 후타라산 신사',
                    text: '난타이산과 닛코의 산악 신앙과 관련된 신사입니다.',
                    detail: '세계유산인 닛코의 신사와 사찰을 구성하는 유적 중 하나입니다.'
                },
                rinnoji: {
                    name: '린노지',
                    text: '나라 시대에 창건된 닛코의 대표적인 불교 사찰입니다.',
                    detail: '삼불당 등 역사적인 건축물이 있습니다.'
                },
                shinkyo: {
                    name: '신쿄 다리',
                    text: '닛코를 대표하는 아름다운 붉은색 다리입니다.'
                }
            },

            'zh-cn': {
                pageTitle: 'NIKKO NAVI｜日光旅游地图',
                intro: '探索日光的旅游景点！',
                trackingStart: '分享我的位置',
                trackingStop: '停止分享位置',
                trackingPending: '正在获取位置...',
                locationPopup: '您的当前位置',
                locationUnavailable: '此浏览器不支持地理位置功能。',
                locationError: '无法获取当前位置，请检查位置权限和设置。',
                toshogu: {
                    name: '日光东照宫',
                    text: '供奉德川家康的神社。',
                    detail: '它是世界遗产“日光的神社与寺院”的组成部分。'
                },
                futarasan: {
                    name: '日光二荒山神社',
                    text: '这是一座与男体山及日光山岳信仰密切相关的神社。',
                    detail: '它是世界遗产“日光的神社与寺院”的组成部分。'
                },
                rinnoji: {
                    name: '轮王寺',
                    text: '创建于奈良时代，是日光具有代表性的佛教寺院。',
                    detail: '寺内有三佛堂等历史建筑。'
                },
                shinkyo: {
                    name: '神桥',
                    text: '日光著名的朱红色桥梁，是当地的代表性地标。'
                }
            },

            'zh-tw': {
                pageTitle: 'NIKKO NAVI｜日光旅遊地圖',
                intro: '探索日光的觀光景點！',
                trackingStart: '分享我的位置',
                trackingStop: '停止分享位置',
                trackingPending: '正在取得位置...',
                locationPopup: '您的目前位置',
                locationUnavailable: '此瀏覽器不支援地理位置功能。',
                locationError: '無法取得目前位置，請檢查位置權限與設定。',
                toshogu: {
                    name: '日光東照宮',
                    text: '供奉德川家康的神社。',
                    detail: '它是世界遺產「日光的神社與寺院」的一部分。'
                },
                futarasan: {
                    name: '日光二荒山神社',
                    text: '這是一座與男體山及日光山岳信仰密切相關的神社。',
                    detail: '它是世界遺產「日光的神社與寺院」的一部分。'
                },
                rinnoji: {
                    name: '輪王寺',
                    text: '創建於奈良時代，是日光具代表性的佛教寺院。',
                    detail: '寺內有三佛堂等歷史建築。'
                },
                shinkyo: {
                    name: '神橋',
                    text: '日光著名的朱紅色橋梁，也是當地的代表性地標。'
                }
            },

            vi: {
                pageTitle: 'NIKKO NAVI | Bản đồ du lịch Nikko',
                intro: 'Khám phá các điểm tham quan ở Nikko!',
                trackingStart: 'Chia sẻ vị trí của tôi',
                trackingStop: 'Dừng chia sẻ vị trí',
                trackingPending: 'Đang lấy vị trí...',
                locationPopup: 'Vị trí hiện tại của bạn',
                locationUnavailable: 'Trình duyệt này không hỗ trợ định vị.',
                locationError: 'Không thể lấy vị trí hiện tại. Vui lòng kiểm tra quyền truy cập và cài đặt vị trí.',
                toshogu: {
                    name: 'Đền Nikko Toshogu',
                    text: 'Ngôi đền thờ Tokugawa Ieyasu.',
                    detail: 'Đây là một phần của Di sản Thế giới “Các đền thờ và chùa ở Nikko”.'
                },
                futarasan: {
                    name: 'Đền Nikko Futarasan',
                    text: 'Ngôi đền gắn liền với núi Nantai và tín ngưỡng núi ở Nikko.',
                    detail: 'Đây là một phần của Di sản Thế giới “Các đền thờ và chùa ở Nikko”.'
                },
                rinnoji: {
                    name: 'Chùa Rinnoji',
                    text: 'Ngôi chùa Phật giáo tiêu biểu ở Nikko, được thành lập vào thời Nara.',
                    detail: 'Chùa có các công trình lịch sử như Điện Sanbutsudo.'
                },
                shinkyo: {
                    name: 'Cầu Shinkyo',
                    text: 'Cây cầu sơn đỏ nổi tiếng và là một địa danh tiêu biểu của Nikko.'
                }
            }
        };

        // 観光スポットの説明を現在の言語に変更
        function changeLanguage(lang) {
            const t = translations[lang];

            if (!t) return;

            document.documentElement.lang = lang;
            document.title = t.pageTitle;
            document.getElementById('intro').textContent = t.intro;

            updateTrackingButton();

            toshogu.bindPopup(`
                <h2>${t.toshogu.name}</h2>
                <img src="neko.png.png" alt="${t.toshogu.name}" width="250">
                <p>${t.toshogu.text}</p>
                <p>${t.toshogu.detail}</p>
            `);

            futarasan.bindPopup(`
                <h2>${t.futarasan.name}</h2>
                <p>${t.futarasan.text}</p>
                <p>${t.futarasan.detail}</p>
            `);

            rinnoji.bindPopup(`
                <h2>${t.rinnoji.name}</h2>
                <p>${t.rinnoji.text}</p>
                <p>${t.rinnoji.detail}</p>
            `);

            shinkyo.bindPopup(`
                <h2>${t.shinkyo.name}</h2>
                <p>${t.shinkyo.text}</p>
            `);
        }

        // 現在地追跡の状態
        let watchId = null;
        let currentLocationMarker = null;
        let trackingStatus = 'off';

        function updateTrackingButton() {
            const t = translations[document.documentElement.lang]
                || translations.ja;

            const button = document.getElementById('trackingButton');

            if (trackingStatus === 'on') {
                button.textContent = t.trackingStop;
            } else if (trackingStatus === 'pending') {
                button.textContent = t.trackingPending;
            } else {
                button.textContent = t.trackingStart;
            }
        }

        // ボタン1つで追跡開始・停止
        function toggleTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                trackingStatus = 'off';
                updateTrackingButton();
                return;
            }

            if (!navigator.geolocation) {
                const t = translations[document.documentElement.lang]
                    || translations.ja;
                alert(t.locationUnavailable);
                return;
            }

            trackingStatus = 'pending';
            updateTrackingButton();

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (currentLocationMarker === null) {
                        currentLocationMarker = L.marker([lat, lng])
                            .addTo(map);
                    } else {
                        currentLocationMarker.setLatLng([lat, lng]);
                    }

                    const t = translations[document.documentElement.lang]
                        || translations.ja;

                    currentLocationMarker.bindPopup(t.locationPopup);

                    map.setView([lat, lng], 16);

                    trackingStatus = 'on';
                    updateTrackingButton();
                },

                function(error) {
                    const t = translations[document.documentElement.lang]
                        || translations.ja;

                    if (watchId !== null) {
                        navigator.geolocation.clearWatch(watchId);
                    }

                    watchId = null;
                    trackingStatus = 'off';
                    updateTrackingButton();

                    alert(t.locationError);
                },

                {
                    enableHighAccuracy: true
                }
            );
        }

        // 最初は日本語で表示
        changeLanguage('ja');
    </script>

</body>
</html>
