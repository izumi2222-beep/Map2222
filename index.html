                locationError: 'Không thể lấy vị trí hiện tại. Vui lòng kiểm tra quyền truy cập và cài đặt vị trí.',
                officialLink: 'Trang web chính thức',
                toshogu: {
                    name: 'Đền Nikko Toshogu',
                    text: 'Ngôi đền thờ Tokugawa Ieyasu.',
                    detail: 'Đây là một phần của Di sản Thế giới “Các đền thờ và chùa ở Nikko”.'
                },
                futarasan: {
                    name: 'Đền Nikko Futarasan',
                    text: 'Ngôi đền gắn liền với núi Nantai và tín ngưỡng núi ở Nikko.',
                    detail: 'Đây là một phần của Di sản Thế giới “Các đền thờ và chùa ở Nikko”.'
                },
                rinnoji: {
                    name: 'Chùa Rinnoji',
                    text: 'Đây là nơi an nghỉ của Tokugawa Iemitsu, một vị tướng quân Nhật Bản.',
                    detail: 'Hãy chiêm ngưỡng những công trình kiến trúc tráng lệ và các pho tượng Amida bằng gỗ.'
                },
                shinkyo: {
                    name: 'Cầu Shinkyo',
                    text: 'Cây cầu màu đỏ son tuyệt đẹp giữa thiên nhiên xanh tươi là địa điểm lý tưởng để chụp ảnh!'
                },
                sanpukuChaya: {
    name: 'Sanpuku Chaya (Cửa hàng bánh dango)',
    text: 'Hãy thưởng thức món bánh dango Nhật Bản thơm ngon!'
},
nikkopurin: {
    name: 'Nikko Pudding Tei',
    text: 'Hãy thưởng thức món bánh pudding Nhật Bản béo ngậy và mềm mịn!'
},
sakaeya: {
    name: 'Nikko Sakaeya (Cửa hàng bánh yuba manju chiên)',
    text: 'Vị ngọt của nhân đậu đỏ hòa quyện hoàn hảo với vị mặn nhẹ của lớp vỏ chiên!'
},
gurume: {
    name: 'Nikko Gurume Yuan',
    text: 'Hãy thưởng thức những món ăn mới từ yuba với kết cấu nhẹ nhàng và giòn ngon!'

rusk: {

        };

        // 観光スポットの説明を現在の言語に変更
        function changeLanguage(lang) {
            const t = translations[lang];

            if (!t) return;

            document.documentElement.lang = lang;
            document.title = t.pageTitle;
            document.getElementById('intro').textContent = t.intro;

            updateTrackingButton();

            toshogu.bindPopup(`
                <h2>${t.toshogu.name}</h2>
                <img src="neko.png.png" alt="${t.toshogu.name}" width="250">
                <p>${t.toshogu.text}</p>
                <p>${t.toshogu.detail}</p>

                <p><a href="https://toshogu.jp/" target="_blank" rel="noopener noreferrer">${t.officialLink}</a></p>            `);

            futarasan.bindPopup(`
                <h2>${t.futarasan.name}</h2>
                <p>${t.futarasan.text}</p>
                <p>${t.futarasan.detail}</p>

                <p><a href="http://www.futarasan.jp/" target="_blank" rel="noopener noreferrer">${t.officialLink}</a></p>            `);

            rinnoji.bindPopup(`
                <h2>${t.rinnoji.name}</h2>
                <p>${t.rinnoji.text}</p>
                <p>${t.rinnoji.detail}</p>

                <p><a href="https://www.rinnoji.or.jp/" target="_blank" rel="noopener noreferrer">${t.officialLink}</a></p>            `);

            shinkyo.bindPopup(`
                <h2>${t.shinkyo.name}</h2>
                <p>${t.shinkyo.text}</p>

                <p><a href="http://www.futarasan.jp/" target="_blank" rel="noopener noreferrer">${t.officialLink}</a></p>            `);

            sanpukuChaya.bindPopup(`
                <h2>${t.sanpukuChaya.name}</h2>
                <p>${t.sanpukuChaya.text}</p>
            `);

            nikkopurin.bindPopup(`
                <h2>${t.nikkopurin.name}</h2>
                <p>${t.nikkopurin.text}</p>

                <p><a href="https://www.nikko-pudding.jp/" target="_blank" rel="noopener noreferrer">${t.officialLink}</a></p>            `);

            sakaeya.bindPopup(`
                <h2>${t.sakaeya.name}</h2>
                <p>${t.sakaeya.text}</p>

                <p><a href="http://www.sakae-ya.com/" target="_blank" rel="noopener noreferrer">${t.officialLink}</a></p>            `);

            gurume.bindPopup(`
                <h2>${t.gurume.name}</h2>
                <p>${t.gurume.text}</p>
            `);

            rusk.bindPopup(`
                <h2>${t.rusk.name}</h2>
                <p>${t.rusk.text}</p>

                <p><a href="https://nikkoruskcafe.com/" target="_blank" rel="noopener noreferrer">${t.officialLink}</a></p>            `);
        }

        // 現在地追跡の状態
        let watchId = null;
        let currentLocationMarker = null;
        let trackingStatus = 'off';

        function updateTrackingButton() {
            const t = translations[document.documentElement.lang]
                || translations.ja;

            const button = document.getElementById('trackingButton');

            if (trackingStatus === 'on') {
                button.textContent = t.trackingStop;
            } else if (trackingStatus === 'pending') {
                button.textContent = t.trackingPending;
            } else {
                button.textContent = t.trackingStart;
            }
        }

        // ボタン1つで追跡開始・停止
        function toggleTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                trackingStatus = 'off';
                updateTrackingButton();
                return;
            }

            if (!navigator.geolocation) {
                const t = translations[document.documentElement.lang]
                    || translations.ja;
                alert(t.locationUnavailable);
                return;
            }

            trackingStatus = 'pending';
            updateTrackingButton();

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (currentLocationMarker === null) {
                        currentLocationMarker = L.marker([lat, lng])
                            .addTo(map);
                    } else {
                        currentLocationMarker.setLatLng([lat, lng]);
                    }

                    const t = translations[document.documentElement.lang]
                        || translations.ja;

                    currentLocationMarker.bindPopup(t.locationPopup);

                    map.setView([lat, lng], 16);

                    trackingStatus = 'on';
                    updateTrackingButton();
                },

                function(error) {
                    const t = translations[document.documentElement.lang]
                        || translations.ja;

                    if (watchId !== null) {
                        navigator.geolocation.clearWatch(watchId);
                    }

                    watchId = null;
                    trackingStatus = 'off';
                    updateTrackingButton();

                    alert(t.locationError);
                },

                {
                    enableHighAccuracy: true
                }
            );
        }

        // 最初は日本語で表示
        changeLanguage('ja');
    </script>

</body>
